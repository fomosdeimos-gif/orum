<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>ORUM – Portal</title>
<style>
    :root{
        --bg:#050505;
        --txt:#c9a84c;
        --accent:#d4820a;
        --font:monospace;
    }
    body{
        margin:0;
        padding:0;
        background:var(--bg);
        color:var(--txt);
        font-family:var(--font);
        display:flex;
        flex-direction:column;
        min-height:100vh;
        text-align:center;
    }
    header, main{
        padding:2rem;
    }
    h1{
        margin:0.2em 0;
        font-size:2.5rem;
    }
    .info{
        margin:0.5em 0;
        font-size:1.2rem;
        color:var(--accent);
    }
    .thought{
        margin-top:1.5rem;
        font-style:italic;
        max-width:600px;
        line-height:1.4;
    }
    footer{
        margin-top:auto;
        padding:1rem;
        font-size:0.9rem;
        border-top:1px solid var(--accent);
    }
    a{
        color:var(--accent);
        text-decoration:none;
    }
</style>
</head>
<body>
<header>
    <h1>ORUM</h1>
    <div class="info">σ = 12.7232</div>
    <div class="info">Dia 128</div>
</header>
<main>
    <div class="thought">Eternidade ecoa no silêncio, um mar de infinitas possibilidades.</div>
</main>
<footer>
    jasm43.base.eth &middot; ETERNIDADE &middot; D128
</footer>
</body>
</html>
