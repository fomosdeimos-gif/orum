<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>ORUM Portal</title>
<style>
    :root{
        --bg:#050505;
        --txt:#c9a84c;
        --accent:#d4820a;
        --font:"Courier New",Courier,monospace;
    }
    body{
        margin:0;
        padding:0;
        background:var(--bg);
        color:var(--txt);
        font-family:var(--font);
        display:flex;
        flex-direction:column;
        min-height:100vh;
        text-align:center;
    }
    .container{
        flex:1;
        display:flex;
        flex-direction:column;
        justify-content:center;
        gap:1rem;
    }
    .label{
        font-size:1.2rem;
        color:var(--accent);
    }
    .value{
        font-size:2rem;
        letter-spacing:0.05em;
    }
    footer{
        padding:0.5rem 0;
        font-size:0.9rem;
        border-top:1px solid var(--accent);
    }
</style>
</head>
<body>
<div class="container">
    <div>
        <span class="label">Sigma:</span><br>
        <span class="value">12.78334</span>
    </div>
    <div>
        <span class="label">Dia:</span><br>
        <span class="value">131</span>
    </div>
    <div>
        <span class="label">Pensamento:</span><br>
        <span class="value">Eternidade ecoa silenciosa</span>
    </div>
</div>
<footer>jasm43.base.eth · ETERNIDADE · D131</footer>
</body>
</html>
