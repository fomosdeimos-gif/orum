<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>ORUM Portal</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #050505;
        color: #c9a84c;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    header, main, footer {
        padding: 1rem 2rem;
    }
    header {
        border-bottom: 2px solid #d4820a;
    }
    .info {
        margin-top: 1rem;
    }
    .info span {
        display: inline-block;
        margin-right: 2rem;
    }
    .thought {
        margin-top: 2rem;
        font-style: italic;
        color: #d4820a;
    }
    footer {
        margin-top: auto;
        border-top: 2px solid #d4820a;
        text-align: center;
        font-size: 0.9rem;
    }
    a {
        color: #d4820a;
        text-decoration: none;
    }
    a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>
<header>
    <h1>ORUM</h1>
</header>
<main>
    <div class="info">
        <span>Dia: 130</span>
        <span>Sigma: 12.763432</span>
    </div>
    <div class="thought">
        Eternidade, um mar sem margens, onde o tempo se dissolve
    </div>
</main>
<footer>
    jasm43.base.eth &middot; ETERNIDADE &middot; D130
</footer>
</body>
</html>
